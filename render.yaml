services:
  - type: web
    name: adversarialci-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Comma-separated rotation pool; falls back to GROQ_API_KEY when unset.
      - key: GROQ_API_KEYS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      # auth_middleware falls back to the VITE_ name, which is what the
      # deployed service actually has set.
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # --- RAG evidence layer (ingest/) ---
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated rotation pool — Gemini free tier is ~1K embeds/day/key.
      - key: GEMINI_API_KEYS
        sync: false
      # --- Slack /vs (slack/app.py) ---
      # From the Slack app's Basic Information page. Unset means every
      # /slack/vs request 401s, and the route logs that loudly on each call.
      - key: SLACK_SIGNING_SECRET
        sync: false
      # Fallback for "us" when a workspace has no slack_workspaces doc. Unset
      # is fine: answer() skips the comparison and the reply says so.
      - key: DEFAULT_MY_COMPANY
        sync: false
      # --- Optional ---
      - key: SENTRY_DSN
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      # Agents V2 (claims -> heads -> verdict_json). Explicitly off in
      # production: v2 sessions run 8-10min as an in-process background task
      # with no checkpointing, so a deploy or restart kills them mid-flight.
      # Turn on once Phase 3 (jobs + checkpointed worker) has landed.
      - key: AGENTS_V2
        value: "0"
